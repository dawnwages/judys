{% load wagtailcore_tags wagtailimages_tags %}
<article class="post-card">
  <a href="{% pageurl post %}" class="post-card-link">
    <div class="post-card-img">
      {% if post.feature_image %}{% image post.feature_image fill-800x560 format-webp loading="lazy" alt="" %}{% else %}<div class="img-placeholder" aria-hidden="true"></div>{% endif %}
    </div>
    <p class="post-meta"><time datetime="{{ post.date|date:'Y-m-d' }}">{{ post.date|date:"F j, Y" }}</time> · {{ post.reading_minutes }} min read</p>
    <h3>{{ post.title }}</h3>
    <p>{{ post.intro|truncatewords:28 }}</p>
  </a>
</article>
