# Render Blueprint for the Judy's Daughter website (production).
# This service started as staging and was promoted to production. Keep its
# name as is: renaming it here would make Render create a new service.
# Render asks for the values marked "sync: false" when you create it.
services:
  - type: web
    name: judys-daughter-staging
    runtime: python
    region: oregon              # closest to California; can't be changed later
    plan: starter               # paid plan: needed for the photo disk
    branch: main
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash scripts/start.sh
    healthCheckPath: /healthz   # answered before host checks (see core/middleware.py)
    disk:
      name: judys-media
      mountPath: /var/data      # Lyndsay's uploaded photos survive deploys here
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.7"
      - key: DJANGO_SETTINGS_MODULE
        value: judys.settings.deploy
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: judys-daughter-staging-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: STAGING            # "true" shows the staging banner and hides the site from search engines
        value: "false"
      # The real web address, used for full links in feeds, previews and emails.
      - key: SITE_HOSTNAME
        value: judysdaughter.support
      - key: ALLOWED_HOSTS
        value: judysdaughter.support,www.judysdaughter.support
      - key: WAGTAILADMIN_BASE_URL
        value: https://judysdaughter.support
      # Where contact-form messages go (kept out of this public repo).
      - key: CONTACT_EMAIL
        sync: false
      # Your admin login, created on the first deploy.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Optional: Google town/city autocomplete on the contact form.
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
      - key: GOOGLE_PLACES_SERVER_KEY
        sync: false

databases:
  - name: judys-daughter-staging-db
    region: oregon
    plan: basic-256mb
