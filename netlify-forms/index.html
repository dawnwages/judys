<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://judysdaughter.support/">
  <title>Judy's Daughter</title>
</head>
<body>
  <p>Judy's Daughter has moved to <a href="https://judysdaughter.support/">judysdaughter.support</a>.</p>

  <!--
    Netlify Forms definition for the website's contact form.
    The real form lives on judysdaughter.support; the website sends each
    message here so Netlify stores it and emails it out (contact/netlify.py).
    Netlify only keeps fields listed below, so keep this in step with the
    contact form's fields in the admin (Pages > Book a free consult).
  -->
  <form name="contact" netlify netlify-honeypot="bot-field" hidden>
    <input name="bot-field">
    <input name="referral">
    <input name="name">
    <input name="pronouns">
    <input name="phone">
    <input name="location">
    <input name="delivery_location">
    <input name="duedate">
    <input name="email">
    <input name="subject">
    <textarea name="message"></textarea>
  </form>
</body>
</html>
